name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Api.mjs unit tests
        run: node --test

      - name: Plugin manifest and entry points (vendored omarchy-plugin-validate)
        run: bash test/omarchy-plugin-validate "$PWD"
