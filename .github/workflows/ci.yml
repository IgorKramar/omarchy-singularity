name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Api.mjs unit tests
        # Фиксированная зона UTC+6 без перехода на летнее время: регрессия на смещение
        # дат утверждает конкретную дату и на раннере в UTC была бы ложной.
        env:
          TZ: Asia/Omsk
        # Файл назван явно: node --test, не найдя ни одного файла, уходит нулём —
        # переименование теста оставило бы джоб зелёным при нуле проверок.
        run: node --test test/api.test.mjs

      - name: Plugin manifest and entry points (vendored omarchy-plugin-validate)
        run: bash test/omarchy-plugin-validate "$PWD"
